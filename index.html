<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Totalizador de Ventas</title>
  </head>
  <body>
    <h1>Totalizador de Ventas</h1>
    <form id="venta-form">
      <input type="number" id="cantidad" placeholder="Cantidad" min="1" step="1" required />
      <input type="number" id="precio" placeholder="Precio ($)" min="0.1" step="0.1" required />
      <div>
        <label for="estado">Código de estado:</label>
        <select id="estado">
          <option value="UT">UT - Utah</option>
          <option value="NV">NV - Nevada</option>
          <option value="TX">TX - Texas</option>
          <option value="AL">AL - Alabama</option>
          <option value="CA" selected>CA - California</option> <!-- CA por defecto -->
        </select>
      </div>
      <div>
        <label for="categoria">Categoría de producto:</label>
        <select id="categoria">
          <option value="Varios" selected>Varios</option>
          <option value="Alimentos">Alimentos</option>
          <option value="Bebidas alcoholicas">Bebidas alcohólicas</option>
          <option value="Material de escritorio">Material de escritorio</option>
          <option value="Muebles">Muebles</option>
          <option value="Electronicos">Electrónicos</option>
          <option value="Vestimenta">Vestimenta</option>
        </select>
      </div>

      <div>
        <label for="peso">Peso volumétrico por unidad:</label>
        <input type="number" id="peso" min="1" step="1" required />
      </div>

      <div>
        <label for="cliente">Tipo de cliente:</label>
        <select id="cliente">
          <option value="Normal" selected>Normal</option>
          <option value="Recurrente">Recurrente</option>
          <option value="Antiguo Recurrente">Antiguo Recurrente</option>
          <option value="Especial">Especial</option>
        </select>
      </div>

      <input type="submit" value="Totalizar" />
    </form>

    <div id="resultado-div"></div>
    
    
    <div id="acciones-compra" style="display: none; margin-top: 15px;">
      <button id="btn-confirmar" style="background-color: #4CAF50; color: white; padding: 10px;">Confirmar compra</button>
      <button id="btn-cancelar" style="background-color: #f44336; color: white; padding: 10px;">Cancelar compra</button>
    </div>

    <script type="module" src="./src/presenter.js"></script>

    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
