<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Totalizador de Ventas</title>
  </head>
  <body>
    <h1>Totalizador de Ventas</h1>
    <form id="venta-form">
      <input type="number" id="cantidad" placeholder="Cantidad" required />
      <input type="number" id="precio" placeholder="Precio ($)" required />
      <div>
        <label for="estado">Código de estado:</label>
        <select id="estado">
          <option value="UT">UT - Utah</option>
          <option value="NV">NV - Nevada</option>
          <option value="TX">TX - Texas</option>
          <option value="AL">AL - Alabama</option>
          <option value="CA" selected>CA - California</option> <!-- CA por defecto -->
        </select>
      </div>
      <input type="submit" value="Totalizar" />
    </form>

    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
